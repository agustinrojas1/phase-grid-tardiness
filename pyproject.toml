[project]
name = "pgt"
version = "0.1.0"
description = "Phase-grid assignment algorithm for 1 | r_j, p_j = p | sum w_j T_j (Chen & Hall) with exact oracles"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "agustinrojas1", email = "agustinr2k@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "highspy>=1.15.1",
    "numpy>=2.5.4",
    "scipy>=1.14",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.5",
    "matplotlib>=3.11.2",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[project.scripts]
pgt = "pgt.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741"]
